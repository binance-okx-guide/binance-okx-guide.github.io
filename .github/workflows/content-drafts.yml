name: Generate and publish long-tail content

on:
  schedule:
    - cron: "23 1 * * 1-5"
  workflow_dispatch:
    inputs:
      count:
        description: Number of drafts (1-10)
        required: false
        default: "3"

permissions:
  contents: write

concurrency:
  group: long-tail-content-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build long-tail keyword matrix
        run: node scripts/build-keyword-matrix.mjs
      - name: Generate long-tail drafts
        env:
          DRAFT_COUNT: ${{ inputs.count || '3' }}
        run: node scripts/generate-drafts.mjs --count="$DRAFT_COUNT" --publish
      - name: Run content quality gate
        run: node scripts/audit-content.mjs
      - name: Build Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.164.0"
          extended: true
      - run: hugo --minify --destination hugo-public
      - name: Publish audited articles to main
        run: |
          git add content/articles
          if git diff --cached --quiet; then
            echo "No keyword briefs remain."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish audited long-tail articles"
          git pull --rebase origin main
          git push origin HEAD:main
